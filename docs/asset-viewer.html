<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asset Viewer — Kenney CC0 models</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f2e2cf; color: #3d3226; display: flex; height: 100vh; overflow: hidden; }
    #sidebar { width: 340px; min-width: 340px; display: flex; flex-direction: column; border-right: 1px solid #d9c3a5; background: #faf3e7; }
    #sidebar header { padding: 10px 12px; border-bottom: 1px solid #d9c3a5; }
    #sidebar h1 { font-size: 15px; margin: 0 0 8px; }
    .page-version { font-size: 11px; color: #8a6f4d; font-family: ui-monospace, monospace; }
    #search { width: 100%; padding: 6px 8px; border: 1px solid #d9c3a5; border-radius: 8px; font-size: 13px; }
    #group-by-label { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #8a6f4d; margin-bottom: 8px; }
    #group-by { flex: 1; padding: 5px 6px; border: 1px solid #d9c3a5; border-radius: 8px; font-size: 13px; background: #fff; }
    #model-list { flex: 1; overflow-y: auto; padding: 6px; }
    .kit-name { font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #8a6f4d; margin: 10px 4px 4px; cursor: pointer; user-select: none; padding: 3px 6px; border-radius: 6px; }
    .kit-name:hover { background: #efe0c8; }
    .model-row { display: flex; align-items: center; gap: 6px; padding: 3px 6px 3px 22px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .model-row:hover { background: #efe0c8; }
    .model-row.selected { background: #6c5ce7; color: #fff; }
    .model-row.excluded { opacity: .45; text-decoration: line-through; }
    .model-row .exclude-btn { margin-left: auto; border: none; background: none; cursor: pointer; font-size: 13px; padding: 0 2px; visibility: hidden; }
    .model-row:hover .exclude-btn, .model-row.excluded .exclude-btn { visibility: visible; }
    #exclusion-panel { border-top: 1px solid #d9c3a5; padding: 8px 12px; max-height: 30%; display: flex; flex-direction: column; }
    #exclusion-panel h2 { font-size: 13px; margin: 0 0 6px; }
    #exclusion-list { flex: 1; overflow-y: auto; font-family: ui-monospace, monospace; font-size: 11px; background: #fff; border: 1px solid #d9c3a5; border-radius: 6px; padding: 6px; margin: 0 0 6px; white-space: pre-wrap; word-break: break-all; }
    #copy-exclusions { padding: 6px 10px; border: none; border-radius: 8px; background: #6c5ce7; color: #fff; font-size: 13px; cursor: pointer; }
    #copy-exclusions:hover { background: #5a4bd1; }
    #viewport-wrap { flex: 1; position: relative; }
    #viewport { width: 100%; height: 100%; display: block; }
    #preview-bar { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 8px; align-items: center; background: rgba(250,243,231,.92); border: 1px solid #d9c3a5; border-radius: 10px; padding: 8px 12px; font-size: 13px; }
    #preview-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #preview-exclude { margin-left: auto; padding: 5px 12px; border: 1px solid #b03a2e; border-radius: 8px; background: #fff; color: #b03a2e; cursor: pointer; font-size: 13px; white-space: nowrap; }
    #preview-exclude.included { border-color: #2e7d32; color: #2e7d32; }
    #hint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #8a6f4d; background: rgba(250,243,231,.85); padding: 4px 10px; border-radius: 8px; }
    #sidebar-toggle { display: none; position: absolute; top: 10px; left: 10px; z-index: 10; width: 40px; height: 40px; border: 1px solid #d9c3a5; border-radius: 10px; background: rgba(250,243,231,.95); font-size: 18px; cursor: pointer; }
    @media (max-width: 768px) {
      #sidebar { position: absolute; z-index: 5; height: 100%; box-shadow: 2px 0 12px rgba(0,0,0,.15); transform: translateX(0); transition: transform .2s ease; }
      body.sidebar-collapsed #sidebar { transform: translateX(-100%); }
      #sidebar-toggle { display: block; }
      body.sidebar-collapsed #sidebar-toggle { left: 10px; }
      #preview-bar { top: 58px; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/addons/"
      }
    }
  </script>
</head>
<body>
  <aside id="sidebar">
    <header>
      <div id="page-version" class="page-version"></div>
      <h1>Kenney CC0 asset viewer</h1>
      <label id="group-by-label">Group by
        <select id="group-by">
          <option value="kenney" selected>kenney kit</option>
          <option value="todo">todo class</option>
          <option value="not-todo">not-todo</option>
        </select>
      </label>
      <input id="search" type="search" placeholder="Filter models..." autocomplete="off">
    </header>
    <div id="model-list"></div>
    <section id="exclusion-panel">
      <h2>Exclusion list (<span id="exclusion-count">0</span>) — copy and paste to remove models</h2>
      <div id="exclusion-list"></div>
      <button id="copy-exclusions" type="button">Copy exclusion list</button>
    </section>
  </aside>
  <div id="viewport-wrap">
    <button id="sidebar-toggle" type="button" aria-label="Toggle model list">☰</button>
    <canvas id="viewport"></canvas>
    <div id="preview-bar" class="hidden">
      <span id="preview-name"></span>
      <button id="preview-exclude" type="button">Exclude</button>
    </div>
    <div id="hint">Click a model on the left to preview it</div>
  </div>
  <script src="./models/kenney/manifest.js?v=6"></script>
  <script src="./asset-classes.js?v=3"></script>
  <script type="module" src="./asset-viewer.js?v=11"></script>
</body>
</html>
