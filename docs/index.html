<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6c5ce7">
  <title>TODO — MWE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="actions-hidden">
  <div id="room-view"></div>

  <div class="daily-progress">
    <div class="progress-line">
      <div class="daily-bar" id="daily-bar"></div>
      <p class="daily-progress-label">Today: <b id="daily-progress">0/5</b></p>
    </div>
    <div class="progress-line">
      <div class="daily-bar" id="weekly-bar"></div>
      <p class="daily-progress-label">Week: <b id="weekly-progress">0/10</b></p>
    </div>
    <div class="stats top-stats">
      <span class="coins">🪙 <b id="coin-balance">0</b></span>
      <span class="gems">💎 <b id="gem-balance">0</b></span>
      <span class="level">✨ Lv <b id="level-display">1</b></span>
      <span class="top-stats-actions">
        <button id="shop-btn" type="button" aria-label="Open shop">🛒</button>
        <button id="achievements-btn" type="button" aria-label="Achievements">🏆</button>
        <button id="settings-btn" type="button" aria-label="Settings">⚙️</button>
      </span>
      <span class="version" id="app-version"></span>
    </div>
  </div>

  <section id="ui-sheet" class="ui-sheet" aria-label="Task panel">
    <div id="sheet-handle" class="sheet-handle">
      <div id="boost-banner" class="boost-banner hidden">⚡ x1.5 <span id="boost-timer"></span></div>
      <span class="sheet-handle-bar"></span>
      <button id="toggle-actions-btn" type="button" aria-label="Show edit and delete buttons" aria-pressed="false">✎</button>
    </div>
    <div class="sheet-content">

      <main>
        <div class="task-tabs" id="task-tabs">
          <button type="button" data-tab="highlight" class="active">Highlight</button>
          <button type="button" data-tab="todo">Todo</button>
          <button type="button" data-tab="backlog">Backlog</button>
          <button type="button" data-tab="fun">Fun</button>
        </div>
        <ul id="task-list"></ul>
        <p id="empty-hint" class="empty-hint hidden">Nothing to do yet — add a task! 🎉</p>

        <form id="task-form">
          <div class="task-input-row">
            <input id="task-input" type="text" placeholder="New task..." autocomplete="off" maxlength="80" required>
            <button type="submit" id="add-btn">Add</button>
          </div>
          <div class="form-row form-row-labeled">
            <div class="labeled-field">
              <span class="field-label">Type</span>
              <div id="list-wheel"></div>
            </div>
            <div class="labeled-field">
              <span class="field-label">Difficulty</span>
              <div id="difficulty-wheel"></div>
            </div>
            <div class="labeled-field">
              <span class="field-label">Repeat</span>
              <div id="repeat-wheel"></div>
            </div>
          </div>
          <div id="repeat-schedule"></div>
          <div class="form-row form-row-labeled">
            <div class="labeled-field hidden" id="due-at-field">
              <span class="field-label">🕓 Due at</span>
              <div id="due-at-wheels"></div>
            </div>
            <div class="labeled-field">
              <span class="field-label">⏱️ Time limit</span>
              <div id="time-limit-wheel"></div>
            </div>
          </div>
        </form>
      </main>

      <button id="reset-btn" type="button">Reset all data</button>

    </div>
  </section>

  <div id="shop-overlay" class="shop-overlay hidden">
    <div class="shop-panel">
      <div class="shop-header">
        <h2>🛒 Shop</h2>
        <button id="shop-close" type="button" aria-label="Close shop">✕</button>
      </div>
      <div class="shop-tabs">
        <button id="tab-shop" type="button" class="active">Shop</button>
        <button id="tab-owned" type="button">Owned</button>
      </div>
      <div id="shop-content"></div>
    </div>
  </div>
  <div id="achievements-overlay" class="shop-overlay hidden">
    <div class="shop-panel">
      <div class="shop-header">
        <h2>🏆 Achievements</h2>
        <button id="achievements-close" type="button" aria-label="Close achievements">✕</button>
      </div>
      <div id="achievements-content"></div>
    </div>
  </div>
  <div id="settings-overlay" class="shop-overlay hidden">
    <div class="shop-panel">
      <div class="shop-header">
        <h2>⚙️ Settings</h2>
        <button id="settings-close" type="button" aria-label="Close settings">✕</button>
      </div>
      <div id="settings-content">
        <label class="deadline-label" id="settings-day-start-wrap">🌅 New day starts at
          <select id="day-start-select" aria-label="Day start hour">
            <option value="0">00:00 (midnight)</option>
            <option value="2">02:00</option>
            <option value="4">04:00</option>
            <option value="5">05:00</option>
            <option value="6">06:00</option>
          </select>
        </label>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/addons/"
      }
    }
  </script>
  <script src="room-config.js"></script>
  <script src="confetti.js"></script>
  <script src="reward-flight.js"></script>
  <script src="wheel-select.js"></script>
  <script src="confirm-dialog.js"></script>
  <script type="module" src="room.js"></script>
  <script type="module" src="game.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
