<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6c5ce7">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TODO">
  <title>TODO — MWE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="actions-hidden">
  <div id="room-view"></div>

  <div class="daily-progress">
    <div class="progress-lines">
      <div class="progress-line">
        <div class="daily-bar" id="daily-bar"></div>
        <p class="daily-progress-label">Today: <b id="daily-progress">0/5</b></p>
      </div>
      <div class="progress-line">
        <div class="daily-bar" id="weekly-bar"></div>
        <p class="daily-progress-label">Week: <b id="weekly-progress">0/10</b></p>
      </div>
      <button id="week-review-btn" type="button" aria-label="Week review" title="Week review">📅</button>
    </div>
    <div class="stats top-stats">
      <span class="coins"><span data-icon="coin"></span> <b id="coin-balance">0</b></span>
      <span class="gems"><span data-icon="gem"></span> <b id="gem-balance">0</b></span>
      <span class="level"><span data-icon="sparkles"></span> Lv <b id="level-display">1</b></span>
      <span class="streak-sum"><span data-icon="fire"></span> <b id="streak-sum">0</b></span>
      <span class="top-stats-actions">
        <span class="version" id="app-version"></span>
        <button id="shop-btn" type="button" aria-label="Open shop"><span data-icon="cart"></span></button>
        <button id="achievements-btn" type="button" aria-label="Achievements"><span data-icon="trophy"></span></button>
        <button id="settings-btn" type="button" aria-label="Settings"><span data-icon="gear"></span></button>
        <button id="info-btn" type="button" aria-label="Info: how to use the app"><span data-icon="info"></span></button>
      </span>
    </div>
  </div>

  <section id="ui-sheet" class="ui-sheet" aria-label="Task panel">
    <div id="sheet-handle" class="sheet-handle">
      <div id="boost-banner" class="boost-banner hidden" title="Reward boost active"><div id="boost-bar-fill"></div></div>
      <span class="sheet-handle-bar"></span>
    </div>
    <div class="sheet-content">

      <main>
        <div class="task-tabs" id="task-tabs">
          <button type="button" data-tab="highlight" class="active">Highlight</button>
          <button type="button" data-tab="todo">Todo</button>
          <button type="button" data-tab="backlog">Backlog</button>
          <button type="button" data-tab="fun">Fun</button>
          <button id="toggle-actions-btn" type="button" aria-label="Show edit and delete buttons" aria-pressed="false"><span data-icon="pencil"></span></button>
        </div>
        <ul id="task-list"></ul>
        <p id="empty-hint" class="empty-hint hidden">Nothing to do yet <span data-icon="emDash"></span> add a task! <span data-icon="party"></span></p>

        <form id="task-form">
          <div class="task-input-row">
            <input id="task-input" type="text" placeholder="New task..." autocomplete="off" maxlength="80" required>
            <button type="submit" id="add-btn">Add</button>
          </div>
          <div class="form-row form-row-labeled">
            <div class="labeled-field">
              <span class="field-label">Type</span>
              <div id="list-wheel"></div>
            </div>
            <div class="labeled-field">
              <span class="field-label">Difficulty</span>
              <div id="difficulty-wheel"></div>
            </div>
            <div class="labeled-field">
              <span class="field-label">Repeat</span>
              <div id="repeat-wheel"></div>
            </div>
          </div>
          <div id="repeat-schedule"></div>
          <div class="form-row form-row-labeled">
            <div class="labeled-field hidden" id="deadline-slot"></div>
            <div class="labeled-field hidden" id="due-at-field">
              <div class="field-label-row" id="due-at-label-row">
                <span class="field-label" id="due-at-label"><span data-icon="clock"></span> Time</span>
              </div>
              <div id="due-at-wheels"></div>
            </div>
          </div>
          <div class="form-row form-row-labeled" id="time-limit-row">
            <div class="labeled-field">
              <span class="field-label"><span data-icon="timeLimit"></span> Time limit</span>
              <div id="time-limit-wheel"></div>
            </div>
          </div>
        </form>
      </main>

    </div>
  </section>

  <div id="shop-overlay" class="shop-overlay hidden">
    <div class="shop-panel">
      <div class="shop-header">
        <h2><span data-icon="cart"></span> Shop</h2>
        <button id="shop-close" type="button" aria-label="Close shop"><span data-icon="x"></span></button>
      </div>
      <div class="shop-tabs">
        <button id="tab-shop" type="button" class="active">Shop</button>
        <button id="tab-owned" type="button">Owned</button>
      </div>
      <div id="shop-content"></div>
    </div>
  </div>
  <div id="achievements-overlay" class="shop-overlay hidden">
    <div class="shop-panel">
      <div class="shop-header">
        <h2><span data-icon="trophy"></span> Achievements</h2>
        <button id="achievements-close" type="button" aria-label="Close achievements"><span data-icon="x"></span></button>
      </div>
      <div id="achievements-content"></div>
    </div>
  </div>
  <div id="info-overlay" class="shop-overlay hidden">
    <div class="shop-panel">
      <div class="shop-header">
        <h2><span data-icon="info"></span> How to use &amp; why it works</h2>
        <button id="info-close" type="button" aria-label="Close info"><span data-icon="x"></span></button>
      </div>
      <div id="info-content"></div>
    </div>
  </div>

  <div id="week-review-overlay" class="shop-overlay hidden">
    <div class="shop-panel">
      <div class="shop-header">
        <h2>📅 Week review</h2>
        <button id="week-review-close" type="button" aria-label="Close week review">✕</button>
      </div>
      <div id="week-review-content"></div>
    </div>
  </div>

  <div id="settings-overlay" class="shop-overlay hidden">
    <div class="shop-panel">
      <div class="shop-header">
        <h2><span data-icon="gear"></span> Settings</h2>
        <button id="settings-close" type="button" aria-label="Close settings"><span data-icon="x"></span></button>
      </div>
      <div id="settings-content">
        <label class="deadline-label" id="settings-day-start-wrap"><span data-icon="sunrise"></span> New day starts at
          <select id="day-start-select" aria-label="Day start hour">
            <option value="0">00:00 (midnight)</option>
            <option value="2">02:00</option>
            <option value="4">04:00</option>
            <option value="5">05:00</option>
            <option value="6">06:00</option>
          </select>
        </label>
        <label class="deadline-label" id="settings-room-wrap"><span data-icon="couch"></span> Show room
          <input type="checkbox" id="room-enabled-check" aria-label="Show 3D room">
        </label>
        <label class="deadline-label" id="settings-autoclean-wrap"><span data-icon="trash"></span> Remove completed one-off tasks after 30 days
          <input type="checkbox" id="auto-clean-check" aria-label="Automatically remove completed non-repeating tasks after 30 days">
        </label>
        <div class="settings-backup" id="settings-backup-wrap">
          <button id="export-btn" type="button"><span data-icon="floppy"></span> Export backup</button>
          <button id="import-btn" type="button"><span data-icon="folder"></span> Import backup</button>
          <input type="file" id="import-file" accept="application/json,.json" hidden>
        </div>
        <button id="reset-btn" type="button">Reset all data</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/addons/",
        "@capacitor/core": "./vendor/capacitor/core.js",
        "@capacitor/haptics": "./vendor/capacitor/haptics/index.js",
        "@capacitor/local-notifications": "./vendor/capacitor/local-notifications/index.js"
      }
    }
  </script>
  <script src="room-config.js"></script>
  <script src="confetti.js"></script>
  <script type="module" src="reward-flight.js"></script>
  <script src="wheel-select.js"></script>
  <script src="confirm-dialog.js"></script>
  <script type="module" src="room-boot.js"></script>
  <script type="module" src="pwa-register.js"></script>
  <script type="module" src="game.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module" src="assistant-bridge.js"></script>
</body>
</html>
