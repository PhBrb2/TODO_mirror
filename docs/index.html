<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6c5ce7">
  <title>TODO — MWE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>TODO</h1>
    <div class="stats">
      <span class="coins">🪙 <b id="coin-balance">0</b></span>
      <span class="gems">💎 <b id="gem-balance">0</b></span>
      <span class="level">✨ Lv <b id="level-display">1</b></span>
      <span class="version" id="app-version"></span>
    </div>
  </header>

  <div id="boost-banner" class="boost-banner hidden">⚡ Reward boost x1.5 — <span id="boost-timer"></span></div>

  <div class="daily-progress">
    <p class="daily-progress-label">Today: <b id="daily-progress">0/5</b></p>
    <div class="daily-bar" id="daily-bar"></div>
    <p class="daily-progress-label">This week: <b id="weekly-progress">0/10</b></p>
    <div class="daily-bar" id="weekly-bar"></div>
    <p class="daily-progress-label">Level <b id="level-display-inline">1</b> — <b id="xp-progress">0/100 XP</b></p>
  </div>

  <main>
    <div id="chest-area"></div>
    <ul id="task-list"></ul>
    <p id="empty-hint" class="empty-hint hidden">Nothing to do yet — add a task! 🎉</p>

    <form id="task-form">
      <input id="task-input" type="text" placeholder="New task..." autocomplete="off" maxlength="80" required>
      <div class="form-row">
        <select id="difficulty-select" aria-label="Difficulty">
          <option value="too_easy">Too easy</option>
          <option value="easy" selected>Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
        <select id="repeat-select" aria-label="Repeat">
          <option value="none" selected>No repeat</option>
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
          <option value="every_5min">Every 5 min (test)</option>
        </select>
        <button type="submit" id="add-btn">Add</button>
      </div>
      <label class="deadline-label">📅 Deadline <input id="deadline-input" type="datetime-local"></label>
    </form>
  </main>

  <div id="toast" class="toast hidden"></div>

  <button id="reset-btn" type="button">Reset all data</button>

  <script src="game.js"></script>
  <script src="app.js"></script>
</body>
</html>
