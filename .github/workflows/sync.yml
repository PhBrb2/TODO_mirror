
name: Sync upstream main

on:
  schedule:
    - cron: "24 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mirror
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync upstream files
        env:
          UPSTREAM_URL: https://github.com/PhBrb/TODO.git
        run: |
          set -e

          # Back up this workflow before replacing the files
          cp .github/workflows/sync.yml /tmp/sync.yml

          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream main

          # Replace tracked files with upstream files
          git rm -r --ignore-unmatch .
          git ls-tree -r --name-only upstream/main \
            | while IFS= read -r file; do
                # Keep the mirror's own workflows; do not import upstream workflows
                case "$file" in
                  .github/workflows/*) continue ;;
                esac
          
                mkdir -p "$(dirname "$file")"
                git show "upstream/main:$file" > "$file"
              done

          # Restore the workflow that powers this sync
          mkdir -p .github/workflows
          cp /tmp/sync.yml .github/workflows/sync.yml

          git add -A
          git diff --cached --quiet && exit 0

          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Sync files from upstream main"

          git push origin main
